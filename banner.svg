<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Mohan Sri R - Python Developer, Aspiring AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;font-size:13px;letter-spacing:2px;fill:#f1eee6}
    .dim{fill:#8a8780}
    .big{font-family:'Arial Black','Helvetica Neue',Impact,sans-serif;font-weight:900;font-size:120px;letter-spacing:-3px}
    .out{font-family:'Arial Black','Helvetica Neue',Impact,sans-serif;font-weight:900;font-size:74px;fill:none;stroke:#3a3835;stroke-width:1.5}
    .marq{animation:slide 22s linear infinite}
    @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-1100px)}}
    .rise{animation:rise 1.2s cubic-bezier(.65,0,.35,1) both}
    .rise2{animation:rise 1.2s .25s cubic-bezier(.65,0,.35,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:1010px 215px}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
    .blink{animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="1200" height="420" fill="#0b0b0c"/>
  <defs>
    <radialGradient id="glow" cx="84%" cy="52%" r="40%"><stop offset="0" stop-color="#ff4a1c" stop-opacity=".35"/><stop offset="1" stop-color="#ff4a1c" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="1200" height="420"/></clipPath>
  </defs>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- outlined marquee -->
  <g clip-path="url(#c)" opacity=".9">
    <g class="marq">
      <text class="out" x="0" y="120">PYTHON ○ PROMPT ENGINEERING ○ AI ○ PYTHON ○ PROMPT ENGINEERING ○ AI ○</text>
    </g>
  </g>

  <!-- HUD frame -->
  <g stroke="#f1eee6" stroke-width="2" fill="none">
    <path d="M24 56V24H56"/><path d="M1144 24H1176V56"/>
    <path d="M24 364V396H56"/><path d="M1144 396H1176V364"/>
  </g>
  <text class="mono" x="72" y="44">MOHAN SRI R <tspan class="dim">/ DEVELOPER REEL</tspan></text>
  <text class="mono dim" x="1128" y="44" text-anchor="end">PORTFOLIO — 2026</text>
  <text class="mono dim" x="72" y="388">00 — INTRO</text>
  <text class="mono dim" x="1128" y="388" text-anchor="end">CHENNAI, IN <tspan class="blink" fill="#ff4a1c">●</tspan> REC</text>

  <!-- title -->
  <g class="rise"><text class="big" x="70" y="250" fill="#f1eee6">MOHAN SRI<tspan fill="#ff4a1c">.</tspan></text></g>
  <g class="rise2">
    <text class="mono" x="76" y="298" style="font-size:18px">PYTHON DEVELOPER  ·  ASPIRING AI ENGINEER</text>
    <text class="mono dim" x="76" y="328">B.Sc. Computer Science  /  Prompt Engineering  /  Rule-based AI</text>
  </g>

  <!-- orb -->
  <circle cx="1010" cy="215" r="120" fill="none" stroke="#f1eee6" stroke-opacity=".25" stroke-width="2"/>
  <circle class="pulse" cx="1010" cy="215" r="62" fill="#ff4a1c"/>

  <!-- progress -->
  <rect x="72" y="404" width="1056" height="2" fill="#2a2927"/>
  <rect x="72" y="404" height="2" fill="#ff4a1c"><animate attributeName="width" from="0" to="1056" dur="8s" repeatCount="indefinite"/></rect>
</svg>
